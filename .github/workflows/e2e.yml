name: e2e

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The system packages are only needed on Linux. On Windows the same flag installs the Media Foundation
      # feature, which takes about three minutes and Chromium does not need.
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --no-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - id: test
        run: npm test
        env:
          PROMPT_API_DOMAIN: eu.prompt.security
          PROMPT_API_KEY: ${{ secrets.PROMPT_API_KEY }}
      - id: redact
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        run: npm run report:redact
        env:
          PROMPT_API_KEY: ${{ secrets.PROMPT_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.redact.outcome == 'success' }}
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: error

  report:
    name: publish reports
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pages: write
      id-token: write
    concurrency:
      group: reports
    environment:
      name: github-pages
    env:
      REPORTS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-report-*
          path: downloaded
      - name: Add the reports to the gh-pages branch, one folder per system
        run: |
          rm -rf "$GITHUB_RUN_ID"
          mkdir "$GITHUB_RUN_ID"
          for report in downloaded/playwright-report-*; do
            system="${report#downloaded/playwright-report-}"
            mv "$report" "$GITHUB_RUN_ID/${system%-latest}"
          done
          rmdir downloaded
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GITHUB_RUN_ID"
          git commit --message "Add the reports of run $GITHUB_RUN_ID"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
      - name: Link the reports from the run summary and from the commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_STATE: ${{ needs.test.result == 'success' && 'success' || 'failure' }}
        run: |
          echo "### Playwright reports" >> "$GITHUB_STEP_SUMMARY"
          for report in "$GITHUB_RUN_ID"/*/; do
            system="$(basename "$report")"
            link="$REPORTS_URL/$system/"
            echo "- [$system]($link)" >> "$GITHUB_STEP_SUMMARY"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --silent -f state="$TESTS_STATE" -f context="report / $system" -f target_url="$link"
          done
